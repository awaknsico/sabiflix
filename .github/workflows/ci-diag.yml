name: CI Diagnostics

# Temporary: makes the Vitest failure summary visible in the run's Summary tab
# (Actions job logs require admin rights to read through the API).
# Deleted once the suite is green.

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Environment
        run: |
          node -v
          npm -v
          uname -m

      - name: Run vitest
        id: vitest
        run: npx vitest run --reporter=verbose > vitest.log 2>&1 || true

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Vitest results'
            echo '```'
            START=$(grep -n 'FAIL  tests/integration' vitest.log | head -1 | cut -d: -f1)
            sed -n "${START},$((START+40))p" vitest.log | tr -d '\r' | tr '\n' '|'
            echo '```'
            echo '## Tail'
            echo '```'
            tail -80 vitest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also emit as an error annotation, which is visible via the public
          # check-run annotations API (and therefore readable without admin).
          START=$(grep -n 'FAIL  tests/' vitest.log | head -1 | cut -d: -f1)
          if [ -n "$START" ]; then
            DETAIL=$(sed -n "$((START+1)),$((START+12))p" vitest.log)
          else
            DETAIL=$(grep -nE 'Error|error|cannot|Could not|failed' vitest.log | grep -v 'Clerk' | head -12)
          fi
          DETAIL=$(printf '%s' "$DETAIL" | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
          echo "::error title=vitest failures::$DETAIL"
