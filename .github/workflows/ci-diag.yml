name: CI Diagnostics

# Temporary: prints the Vitest failure output that the Actions log API hides
# from us (job logs need admin rights). Deleted once the suite is green.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Environment
        run: |
          node -v
          npm -v
          uname -a
          ls -la .data 2>/dev/null || echo ".data does not exist"
          ls -la node_modules/@libsql | head -20

      - name: Run vitest
        run: npx vitest run --reporter=verbose > /tmp/vitest.log 2>&1 || true

      - name: Print failures
        run: |
          echo "=========== FAILED TESTS ==========="
          grep -nE "FAIL|×|AssertionError|Error:|Error \[|ENOENT|EACCES|EBUSY|SQLITE|expected|Test Files|Tests " /tmp/vitest.log | head -80
          echo "=========== LAST 120 LINES ==========="
          tail -120 /tmp/vitest.log
