name: CI Diagnostics

# Temporary: makes the Vitest failure summary visible in the run's Summary tab
# (Actions job logs require admin rights to read through the API).
# Deleted once the suite is green.

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Environment
        run: |
          node -v
          npm -v
          uname -m

      - name: Run vitest
        run: npx vitest run --reporter=verbose > vitest.log 2>&1 || true

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Vitest results'
            echo '```'
            grep -nE 'FAIL|×|✗|AssertionError|Error:|Error \[|cannot|Cannot|ENOENT|EACCES|EBUSY|SQLITE|expected|Test Files|Tests ' vitest.log | head -100
            echo '```'
            echo '## Tail'
            echo '```'
            tail -80 vitest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
