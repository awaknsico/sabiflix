name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests
        run: npm run test

      - name: Run security audit
        run: npm run test:security

      - name: Generate coverage report
        run: npm run test:coverage

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Skipped while tests/e2e has no specs yet - `playwright test` exits 1
      # with "No tests found" and would fail an otherwise green build.
      - name: Check for E2E specs
        id: e2e-specs
        run: |
          if find tests/e2e -name '*.spec.ts' -o -name '*.test.ts' 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No E2E specs in tests/e2e - skipping Playwright run"
          fi

      - name: Run Playwright E2E tests
        if: steps.e2e-specs.outputs.present == 'true'
        run: npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run typecheck