# =============================================================================
# Cloudflare Workers + D1 configuration for SabiFlix
# =============================================================================

name = "sabiflix"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Build output (OpenNext places the worker here)
main = ".open-next/worker.js"

# D1 database binding — the code accesses it as env.DB
[[d1_databases]]
binding = "DB"
database_name = "sabiflix"
database_id = "your-d1-database-id-here"

# R2 bucket for posters and assets (optional)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "sabiflix-assets"

# Environment variables (use `wrangler secret put` for sensitive values)
[vars]
NEXT_PUBLIC_APP_URL = "https://sabiflix.your-domain.com"

# Secrets (set via CLI, NOT here):
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put CLERK_WEBHOOK_SECRET
#   wrangler secret put CF_D1_TOKEN
